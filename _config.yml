title: FAIR Lesson Plan Handbook
baseurl: "" # served at the root of the custom domain (see CNAME)
url: "https://plans.fairdata.education"

# Build settings
remote_theme: ELIXIR-Belgium/elixir-toolkit-theme@7.0.0
theme_color: 0c3450
topnav_title: FAIR Lesson Plan Handbook
permalink: pretty

theme_variables:
  topnav:
    search: false
    github: false
    brand_logo: assets/images/logos/handbook.svg
  fonts:
    - https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@500;600&display=swap

plugins:
  - elixir-toolkit-theme-plugins
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-github-metadata
  - jemoji
  - webrick

collections:
  pages:
    output: true
    permalink: /:path/
  lesson-plans:
    output: true
    permalink: /units/:path/

include:
  - _pages

exclude:
  - docs/
# Exclude from processing.
# The following items will not be processed, by default.
# Any item listed under the `exclude:` key here will be automatically added to
# the internal "default list".
#
# Excluded items can be processed by explicitly listing the directories or
# their entries' file path in the `include:` list.
