name: Zenodo sandbox (dev build)

# Deposits every lesson plan on the Zenodo *sandbox* (10.5072/... DOIs), commits
# the DOIs back into the plans' front matter on the pushed branch, and builds a
# dev copy of the site that shows them. Never deploys to the production domain.

on:
  push:
    branches-ignore: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zenodo-dev-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dev-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1.196.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0

      # Secrets are unavailable to fork PRs: fall back to a dry run there.
      - name: Deposit on Zenodo sandbox
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_SANDBOX_TOKEN }}
          ZENODO_API_URL: https://sandbox.zenodo.org/api
        run: |
          if [ -n "$ZENODO_TOKEN" ]; then
            ruby scripts/zenodo-deposit.rb --mode dev
          else
            echo "No sandbox token available; dry run only."
            ruby scripts/zenodo-deposit.rb --mode dev --dry-run
          fi

      # Pushes made with GITHUB_TOKEN do not retrigger workflows, so no loop.
      - name: Commit sandbox DOIs to the branch
        if: ${{ github.event_name == 'push' }}
        run: |
          if git diff --quiet -- _lesson-plans; then
            echo "No DOI changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _lesson-plans
          git commit -m "Add Zenodo sandbox DOIs to lesson plans"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Build dev site
        run: bundle exec jekyll build
        env:
          PAGES_REPO_NWO: ${{ github.repository }}
          JEKYLL_ENV: development
          JEKYLL_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload dev site
        uses: actions/upload-artifact@v4
        with:
          name: dev-site-zenodo-sandbox
          path: _site
          retention-days: 14
